<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradés pirate -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf1a9"/>
      <stop offset="30%" stop-color="#f2c968"/>
      <stop offset="70%" stop-color="#e5ab48"/>
      <stop offset="100%" stop-color="#966718"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3825"/>
      <stop offset="50%" stop-color="#3b2518"/>
      <stop offset="100%" stop-color="#24140b"/>
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4a4a"/>
      <stop offset="60%" stop-color="#a62828"/>
      <stop offset="100%" stop-color="#540b0b"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#d9c29d"/>
    </linearGradient>

    <!-- Filtres d'ombre portée pour détacher les calques -->
    <filter id="skullShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0d0704" flood-opacity="0.75"/>
    </filter>
    <filter id="wheelShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e130c" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Fond totalement transparent (zéro rectangle de fond opaque) -->

  <!-- Barre de gouvernail / Ship's Wheel -->
  <g filter="url(#wheelShadow)">
    <!-- Anneau extérieur en bois -->
    <circle cx="256" cy="256" r="210" fill="none" stroke="url(#woodGrad)" stroke-width="26"/>
    <circle cx="256" cy="256" r="210" fill="none" stroke="#785f4c" stroke-width="2" stroke-dasharray="8 8"/>
    <circle cx="256" cy="256" r="176" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- Poignées et rayons de la barre -->
    <g stroke="url(#woodGrad)" stroke-width="16" stroke-linecap="round">
      <line x1="256" y1="20" x2="256" y2="492"/>
      <line x1="20" y1="256" x2="492" y2="256"/>
      <line x1="89" y1="89" x2="423" y2="423"/>
      <line x1="89" y1="423" x2="423" y2="89"/>
    </g>
    <!-- Chevilles dorées des poignées -->
    <g fill="url(#goldGrad)">
      <circle cx="256" cy="24" r="14"/>
      <circle cx="256" cy="488" r="14"/>
      <circle cx="24" cy="256" r="14"/>
      <circle cx="488" cy="256" r="14"/>
      <circle cx="92" cy="92" r="14"/>
      <circle cx="420" cy="420" r="14"/>
      <circle cx="92" cy="420" r="14"/>
      <circle cx="420" cy="92" r="14"/>
    </g>
    <!-- Disque central sombre -->
    <circle cx="256" cy="256" r="160" fill="#2d1e15" stroke="url(#goldGrad)" stroke-width="6"/>
  </g>

  <!-- Os croisés avec têtes arrondies articulées aux 4 extrémités -->
  <g stroke="#3b2518" stroke-width="3.5" fill="url(#boneGrad)">
    <!-- Diagonale haut-gauche vers bas-droit -->
    <g>
      <circle cx="130" cy="142" r="15"/>
      <circle cx="142" cy="130" r="15"/>
      <path d="M 148 148 L 364 364 L 348 380 L 132 164 Z" stroke="#3b2518" stroke-width="3"/>
      <circle cx="370" cy="382" r="15"/>
      <circle cx="382" cy="370" r="15"/>
    </g>

    <!-- Diagonale haut-droit vers bas-gauche -->
    <g>
      <circle cx="370" cy="130" r="15"/>
      <circle cx="382" cy="142" r="15"/>
      <path d="M 364 148 L 148 364 L 132 348 L 348 132 Z" stroke="#3b2518" stroke-width="3"/>
      <circle cx="142" cy="382" r="15"/>
      <circle cx="130" cy="370" r="15"/>
    </g>
  </g>

  <!-- Tête de mort avec ombre portée la détachant du disque -->
  <g filter="url(#skullShadow)">
    <!-- Boîte crânienne et mâchoire -->
    <path
      d="M 180 230 
         C 170 170, 210 140, 256 140 
         C 302 140, 342 170, 332 230 
         C 332 265, 315 285, 305 310 
         L 305 350 C 305 365, 290 375, 275 375
         L 237 375 C 222 375, 207 365, 207 350
         L 207 310
         C 197 285, 180 265, 180 230 Z" 
      fill="url(#goldGrad)" stroke="#3b2518" stroke-width="6"/>

    <!-- Pommettes -->
    <path d="M 185 245 C 205 270, 205 295, 208 315" stroke="#785f4c" stroke-width="4" fill="none"/>
    <path d="M 327 245 C 307 270, 307 295, 304 315" stroke="#785f4c" stroke-width="4" fill="none"/>

    <!-- Cache-œil pirate (Œil gauche) -->
    <path d="M 175 200 L 337 265" stroke="#18181b" stroke-width="9" stroke-linecap="round"/>
    <path d="M 215 190 L 215 260" stroke="#18181b" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="225" cy="235" rx="22" ry="26" fill="#18181b" stroke="#3b2518" stroke-width="3"/>
    <circle cx="225" cy="235" r="5" fill="#a62828"/>

    <!-- Orbite droite -->
    <ellipse cx="287" cy="235" rx="21" ry="25" fill="#1e130c" stroke="#3b2518" stroke-width="3"/>
    <ellipse cx="287" cy="235" rx="11" ry="14" fill="#a62828"/>
    <circle cx="289" cy="232" r="4" fill="#fdf1a9"/>

    <!-- Cavité nasale -->
    <path d="M 256 265 C 252 260, 246 270, 248 280 C 250 286, 256 292, 256 292 C 256 292, 262 286, 264 280 C 266 270, 260 260, 256 265 Z" fill="#1e130c"/>

    <!-- Dents avec dent en or -->
    <g fill="#f7f2e7" stroke="#3b2518" stroke-width="2.5">
      <rect x="224" y="322" width="10" height="15" rx="2"/>
      <rect x="236" y="322" width="10" height="17" rx="2" fill="#e5ab48"/>
      <rect x="248" y="322" width="10" height="17" rx="2"/>
      <rect x="260" y="322" width="10" height="17" rx="2"/>
      <rect x="272" y="322" width="10" height="15" rx="2"/>

      <rect x="228" y="342" width="9" height="13" rx="2"/>
      <rect x="239" y="342" width="9" height="14" rx="2"/>
      <rect x="250" y="342" width="9" height="14" rx="2"/>
      <rect x="261" y="342" width="9" height="14" rx="2"/>
      <rect x="272" y="342" width="9" height="13" rx="2"/>
    </g>

    <!-- Couronne dorée Skull King -->
    <path d="M 190 162 
             L 175 100 
             L 218 125 
             L 256 80 
             L 294 125 
             L 337 100 
             L 322 162 
             Z" 
          fill="url(#goldGrad)" stroke="#3b2518" stroke-width="5"/>
    <path d="M 188 152 Q 256 168 324 152 L 322 165 Q 256 182 190 165 Z" fill="#3b2518"/>
    
    <!-- Rubis sur la couronne -->
    <circle cx="175" cy="100" r="7" fill="url(#rubyGrad)" stroke="#3b2518" stroke-width="2"/>
    <circle cx="256" cy="80" r="10" fill="url(#rubyGrad)" stroke="#3b2518" stroke-width="2"/>
    <circle cx="337" cy="100" r="7" fill="url(#rubyGrad)" stroke="#3b2518" stroke-width="2"/>
    <circle cx="225" cy="159" r="4" fill="url(#rubyGrad)"/>
    <circle cx="256" cy="162" r="5" fill="#fdf1a9"/>
    <circle cx="287" cy="159" r="4" fill="url(#rubyGrad)"/>
  </g>
</svg>